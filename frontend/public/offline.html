<!doctype html>
<html lang="en"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#6366f1" /><title>Offline — StudyOS AI</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px;text-align:center}
  main{max-width:360px}h1{font-size:1.25rem;margin:0 0 8px}p{color:#94a3b8;line-height:1.5;margin:0 0 20px}
  button{background:#6366f1;color:#fff;border:0;border-radius:10px;padding:12px 20px;font-size:1rem;min-height:44px;cursor:pointer}
  button:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}
</style></head><body><main>
<h1>You're offline</h1>
<p>StudyOS AI needs a connection to load your syllabus, revisions and tasks. Nothing you've saved is lost — reconnect and try again.</p>
<button type="button" onclick="location.reload()">Try again</button>
</main>
<script>addEventListener("online",function(){location.reload()})</script>
</body></html>
